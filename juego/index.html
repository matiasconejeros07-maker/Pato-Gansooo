<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gánale al Tío Pato</title>
<style>
  :root {
    --bg: #fff7c2;
    --ink: #111;
    --score: #a3a07a;
    --ghost: rgba(140, 130, 50, .38);
    --lose: #c0392b;
    --card: #fffdf0;
    --line: rgba(120, 110, 40, .18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    transition: background-color .9s ease;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  body.end { background: linear-gradient(180deg, #7b3ff2 0%, #b21ee0 55%, #e0149f 100%); transition: none; }
  body.end #close svg { stroke: #fff; }
  body.end .num { color: rgba(255,255,255,.75); }

  /* ---------- barra superior ---------- */
  header {
    position: relative; z-index: 3;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: calc(env(safe-area-inset-top) + 28px) 16px 0;
    height: calc(env(safe-area-inset-top) + 110px);
  }
  #close {
    position: absolute; left: 20px; top: calc(env(safe-area-inset-top) + 34px);
    width: 40px; height: 40px; border: 0; background: none; cursor: pointer; padding: 8px;
  }
  #close svg { width: 100%; height: 100%; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; }
  .num {
    min-width: 3ch; font-size: 28px; font-weight: 800; letter-spacing: .02em;
    color: var(--score); font-variant-numeric: tabular-nums; text-align: center;
    transition: color .2s, transform .15s;
  }
  .num.bump { transform: scale(1.22); color: #6d6a3d; }
  .avatars { display: flex; position: relative; }
  .avatar {
    position: relative; width: 52px; height: 52px; border-radius: 50%;
    display: grid; place-items: center; font-size: 28px;
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.15);
  }
  .avatar.me { background: radial-gradient(circle at 35% 30%, #4a4a4a, #151515); z-index: 1; color: #fff; font-weight: 800; font-size: 24px; }
  .avatar.bot { background: radial-gradient(circle at 35% 30%, #e8e8e8, #8d8d8d); margin-left: -8px; overflow: visible; }
  .avatar.bot.pic { background: radial-gradient(circle at 50% 45%, #c9c9c9, #6f6f6f); }
  .avatar.bot #botFace { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; }
  .avatar.bot img { width: 100%; height: 100%; object-fit: contain; padding: 3px; }
  .crown {
    position: absolute; top: -24px; left: 50%; font-size: 30px; line-height: 1;
    transform: translateX(-50%) scale(0); transition: transform .25s cubic-bezier(.3,1.6,.5,1);
    pointer-events: none; z-index: 2;
  }
  .avatar.lead .crown { transform: translateX(-50%) scale(1); }

  /* ---------- zona de juego ---------- */
  #arena { position: relative; flex: 1; z-index: 1; min-height: 0; touch-action: none; }
  #arena.jolt { animation: jolt .16s linear; }
  @keyframes jolt { 20% { transform: translate(4px, -3px); } 40% { transform: translate(-4px, 3px); } 60% { transform: translate(3px, 2px); } 80% { transform: translate(-2px, -2px); } }
  #big {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: min(46vw, 260px); font-weight: 400; color: var(--ghost);
    pointer-events: none; z-index: 0; transform: translateY(-4%);
  }
  #big.tick { animation: tick .9s ease-out; }
  @keyframes tick { 0% { transform: translateY(-4%) scale(1.25); opacity: .2; } 100% { transform: translateY(-4%) scale(1); opacity: 1; } }
  #fx { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; }

  #target {
    position: absolute; left: 0; top: 0; z-index: 2;
    font-size: 56px; line-height: 1; will-change: transform; pointer-events: none;
    filter: drop-shadow(0 5px 5px rgba(0,0,0,.14));
  }
  #target span { display: inline-block; animation: spin .75s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* El Tío Pato se enoja: --anger va de 0 a 1 (rojo, brillo, temblor y vapor). */
  #duck { position: absolute; left: 0; top: 8px; z-index: 1; font-size: 46px; line-height: 1; pointer-events: none; visibility: hidden; will-change: transform; --anger: 0; --shake: 0px; }
  #duck .body {
    position: relative; display: inline-block;
    filter: sepia(var(--anger)) saturate(calc(1 + var(--anger) * 5)) hue-rotate(calc(var(--anger) * -48deg)) drop-shadow(0 0 calc(var(--anger) * 9px) rgba(255, 50, 20, .9));
    animation: waddle 1.1s ease-in-out infinite;
  }
  #duck.imgs .body { filter: drop-shadow(0 0 calc(var(--anger) * 9px) rgba(255, 50, 20, .85)); }
  #duck.mad .body { animation: waddle 1.1s ease-in-out infinite, fume .11s linear infinite; }
  #duckFace { display: inline-block; line-height: 1; transform-origin: 50% 85%; }
  #duckFace img { display: block; height: 92px; width: auto; max-width: 100px; -webkit-user-drag: none; }
  #duckFace.swing { animation: swing .26s ease-out; }
  #steam { position: absolute; top: -6px; right: -16px; font-size: 24px; opacity: clamp(0, calc(var(--anger) * 2.2 - .5), 1); animation: puff .7s ease-in-out infinite; }
  @keyframes waddle { 50% { transform: rotate(-6deg) translateY(2px); } }
  @keyframes fume { 25% { translate: calc(var(--shake) * -1) 0; } 75% { translate: var(--shake) 0; } }
  @keyframes swing { 30% { transform: rotate(-24deg) translateY(8px) scale(1.12); } 100% { transform: none; } }
  @keyframes puff { 50% { transform: scale(1.25) rotate(8deg); } }
  #bubble {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%) scale(.85); transform-origin: top center;
    white-space: nowrap; font-size: 14px; font-weight: 800; color: #111; background: #fff; padding: 6px 12px;
    border-radius: 14px; box-shadow: 0 3px 10px rgba(0,0,0,.18); opacity: 0; transition: opacity .2s, transform .2s;
  }
  #bubble.on { opacity: 1; transform: translateX(-50%) scale(1); }

  #paddle {
    position: absolute; left: 0; top: 0; height: 16px; border-radius: 999px; background: #111; z-index: 2;
    visibility: hidden; will-change: transform; box-shadow: 0 5px 12px rgba(0,0,0,.22);
    transition: height .08s, margin-top .08s;
  }
  #paddle.hit { height: 11px; margin-top: 3px; }

  .pop {
    position: absolute; z-index: 4; font-weight: 800; font-size: 22px; color: #6d6a3d;
    pointer-events: none; animation: pop .6s ease-out forwards;
  }
  @keyframes pop { from { opacity: 1; transform: translate(-50%, -10px); } to { opacity: 0; transform: translate(-50%, -64px); } }

  /* ---------- pantallas (inicio / final / marcadores) ---------- */
  .screen {
    position: absolute; inset: 0; z-index: 5; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 24px;
    background: rgba(255, 247, 194, .96);
  }
  .screen.show { display: flex; }
  .screen h1 { margin: 0; font-size: 32px; font-weight: 800; line-height: 1.1; }
  .screen p { margin: 0; color: #6b6840; font-size: 16px; max-width: 30ch; line-height: 1.4; }
  .hero { display: inline-block; height: 132px; animation: float 2.2s ease-in-out infinite; filter: drop-shadow(0 8px 8px rgba(0,0,0,.15)); }
  .hero img { height: 100%; width: auto; display: block; }
  @keyframes float { 50% { transform: translateY(-10px) rotate(-3deg); } }
  .btn {
    margin-top: 10px; border: 0; cursor: pointer; background: #111; color: #fff;
    font: inherit; font-size: 18px; font-weight: 700; padding: 16px 44px; border-radius: 999px;
    transition: transform .1s;
  }
  .btn:active { transform: scale(.96); }
  .btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); margin-top: 0; padding: 12px 32px; font-size: 16px; }
  .best { font-size: 14px; color: #8a8658; min-height: 1.2em; }
  .status { font-size: 14px; color: #6b6840; min-height: 1.3em; }
  .status.err { color: var(--lose); }

  #name {
    width: min(100%, 300px); font: inherit; font-size: 20px; font-weight: 700; text-align: center;
    padding: 14px 16px; border-radius: 16px; border: 2px solid var(--ink); background: #fff; color: var(--ink);
    outline: none; -webkit-user-select: text; user-select: text; margin-top: 6px;
  }
  #name:focus { box-shadow: 0 0 0 4px rgba(17,17,17,.12); }
  #name.shake { animation: shake .35s; border-color: var(--lose); }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  /* final: pantalla morada con lluvia de billetes */
  #result { background: transparent; overflow: hidden; gap: 8px; color: #fff; }
  #result > * { position: relative; z-index: 1; }
  #result .rain { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .rain span { position: absolute; top: -60px; animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }
  .verdict { font-size: 26px; font-weight: 800; text-shadow: 0 2px 12px rgba(0,0,0,.25); }
  .final { font-size: 64px; font-weight: 800; line-height: 1.05; text-shadow: 0 2px 12px rgba(0,0,0,.25); font-variant-numeric: tabular-nums; }
  .sub { font-size: 16px; font-weight: 600; opacity: .92; text-shadow: 0 1px 6px rgba(60,0,90,.55); }
  #result .hero { height: 104px; animation: none; }
  #result .btn { background: #111; width: min(100%, 340px); display: flex; align-items: center; justify-content: center; gap: 10px; }
  #result .btn.ghost { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.7); }
  #result .link { background: none; border: 0; color: #fff; font: inherit; font-size: 16px; font-weight: 600; padding: 10px; cursor: pointer; opacity: .9; }
  #result .status { color: rgba(255,255,255,.95); }
  #result .status.err { color: #ffd6d0; }
  #result .best { color: rgba(255,255,255,.85); }
  #result .status, #result .best, #result .link { text-shadow: 0 1px 6px rgba(60,0,90,.55); }

  /* ---------- marcadores ---------- */
  #board { justify-content: flex-start; padding: 8px 16px 20px; gap: 8px; }
  #board h1 { font-size: 28px; margin-top: 4px; }
  .board-note { font-size: 13px; color: #8a8658; min-height: 1.2em; max-width: 38ch; }
  #list {
    list-style: none; margin: 0; padding: 0; width: min(100%, 440px);
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  }
  #list li {
    display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px;
    padding: 12px 16px; border-bottom: 1px solid var(--line); text-align: left; font-size: 17px;
  }
  #list li:last-child { border-bottom: 0; }
  #list .rk { font-weight: 800; color: #8a8658; font-variant-numeric: tabular-nums; text-align: center; }
  #list .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .sc { font-weight: 800; font-variant-numeric: tabular-nums; }
  #list li.top .rk { font-size: 22px; }
  #list li.mine { background: #fff0a0; }
  #list .empty { display: block; text-align: center; color: #8a8658; padding: 28px 16px; }
  #backBoard { margin-top: 4px; }

  @media (prefers-reduced-motion: reduce) {
    #duck .body, #duck.mad .body, #target span, .hero, .rain span { animation: none; }
    #arena.jolt { animation: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="close" aria-label="Salir">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 4 20 20M20 4 4 20"/></svg>
    </button>
    <div class="num" id="meNum">000</div>
    <div class="avatars">
      <div class="avatar me" id="meAv"><span class="crown">👑</span><span id="meInit">😎</span></div>
      <div class="avatar bot" id="botAv"><span class="crown">👑</span><span id="botFace">🦆</span></div>
    </div>
    <div class="num" id="botNum">000</div>
  </header>

  <main id="arena">
    <div id="big"></div>
    <canvas id="fx"></canvas>
    <div id="duck" aria-hidden="true"><div class="body" id="duckBody"><span id="duckFace">🦆</span><span id="steam">💢</span></div><div id="bubble"></div></div>
    <div id="target"><span>💸</span></div>
    <div id="paddle" aria-hidden="true"></div>

    <!-- inicio: nombre -->
    <section class="screen show" id="menu">
      <span class="hero" id="heroBox"><span style="font-size:84px">🦆</span></span>
      <h1>Gánale al Tío Pato</h1>
      <p>El Tío Pato siempre devuelve el billete. Tú solo aguanta: gana quien dure más tiempo, y se pone más difícil con cada rebote.</p>
      <input id="name" type="text" maxlength="16" placeholder="Tu nombre" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Tu nombre">
      <button class="btn" id="play">Jugar</button>
      <button class="btn ghost" id="openBoard">🏆 Marcadores</button>
      <div class="best" id="bestMenu"></div>
    </section>

    <!-- final de partida -->
    <section class="screen" id="result">
      <div class="rain" id="rain"></div>
      <span class="hero" id="heroEnd"></span>
      <div class="verdict">Ganó el Tío Pato</div>
      <div class="final"><span id="finalScore">0</span></div>
      <div class="sub" id="finalSub"></div>
      <div class="status" id="saveStatus"></div>
      <div class="best" id="bestResult"></div>
      <button class="btn" id="again"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Jugar de nuevo</button>
      <button class="btn ghost" id="openBoard2">🏆 Ver marcadores</button>
      <button class="link" id="backResult">Volver</button>
    </section>

    <!-- marcadores -->
    <section class="screen" id="board">
      <h1>🏆 Marcadores</h1>
      <div class="board-note" id="boardNote"></div>
      <ul id="list" aria-live="polite"></ul>
      <button class="btn ghost" id="backBoard">Volver</button>
    </section>
  </main>
</div>

<script src="config.js"></script>
<script>
(() => {
  const SIZE = 56;                // tamaño del emoji (px)
  const R = 24;                   // radio de choque del billete
  const PADDLE_H = 16, PADDLE_BOTTOM = 56;
  const DUCK_BOTTOM = 108;        // borde inferior del Tío Pato: ahí devuelve el billete, siempre
  const SPEED0 = 520, SPEED_STEP = 14, SPEED_MAX = 1250;   // px/s: sube con cada rebote
  const SHRINK_FROM = 8, SHRINK_RATE = .018, SHRINK_MIN = .3;   // desde el rebote 8 la barra se achica hasta el 30%
  const LEVEL_EVERY = 8;          // cada 8 rebotes el Tío Pato sube de nivel
  const TOP_N = 100;              // cuántos jugadores muestra el marcador
  const REFRESH_MS = 15000;       // el marcador se actualiza solo mientras está abierto
  const STORE_KEY = 'gana-al-tio-pato-v1';
  // El fondo cambia cada 10 segundos: amarillo → durazno → naranja → rosado → magenta → violeta
  const PALETTE = ['#fff6c0', '#ffec5c', '#ffb978', '#ffa64f', '#faa3fe', '#f478fd', '#c05cf5'];

  const DB = String(window.DINERO_DB_URL || '').trim().replace(/\/+$/, '');
  const ONLINE = DB !== '';
  const PATO_IMGS = (Array.isArray(window.PATO_IMGS) ? window.PATO_IMGS : []).filter(Boolean);   // caras del Tío Pato, de tranquilo a furioso

  const $ = id => document.getElementById(id);
  const arena = $('arena'), target = $('target'), big = $('big'), paddle = $('paddle'), duck = $('duck');
  const meNum = $('meNum'), botNum = $('botNum'), meAv = $('meAv'), botAv = $('botAv');
  const nameInput = $('name');
  const screens = { menu: $('menu'), result: $('result'), board: $('board') };
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  let state = 'menu';            // menu | countdown | play | over
  let hits = 0, elapsed = 0;     // rebotes · segundos aguantados
  let leaderDs = 0;              // mejor tiempo (décimas de segundo): el del #1 del marcador o el tuyo
  let W = 0, H = 0;
  let x = 0, y = 0, vx = 0, vy = 0, last = 0;
  let px = 0, pw = 110, basePw = 110, keyDir = 0, dragX = null;
  let duckX = 0, duckShow = 0, bubbleTimer = null, faceStage = -2, lastSec = -1;
  let cdTimer = null, audio = null;

  const level = () => Math.floor(hits / LEVEL_EVERY);
  const anger = () => clamp(hits / 36, 0, 1);                   // 0 = tranquilo · 1 = furioso
  const ds = () => Math.floor(elapsed * 10);                    // décimas de segundo: el puntaje
  const paddleTop = () => H - PADDLE_BOTTOM - PADDLE_H;
  const shrink = () => Math.max(SHRINK_MIN, 1 - Math.max(0, hits - SHRINK_FROM) * SHRINK_RATE);
  const ballSpeed = () => Math.min(SPEED0 + hits * SPEED_STEP, SPEED_MAX);

  /* ---------- datos del jugador (solo en este dispositivo) ---------- */
  function newId() {
    const a = new Uint8Array(10);
    (window.crypto || { getRandomValues: v => v.map(() => Math.random() * 256) }).getRandomValues(a);
    return Array.from(a, b => (b % 36).toString(36)).join('') + Date.now().toString(36);
  }
  let player = { id: '', name: '', best: 0, dirty: false };       // best: décimas de segundo
  try { Object.assign(player, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch (e) {}
  if (!/^[a-z0-9]{12,32}$/.test(player.id)) player.id = newId();
  function savePlayer() { try { localStorage.setItem(STORE_KEY, JSON.stringify(player)); } catch (e) {} }
  savePlayer();

  const cleanName = s => String(s || '').replace(/\s+/g, ' ').trim().slice(0, 16);
  const pad = n => String(n).padStart(3, '0');
  function fmtTime(d) {                                          // 473 → "47.3 s" · 782 → "1:18.2"
    const s = d / 10, m = Math.floor(s / 60), r = s - m * 60;
    return m > 0 ? `${m}:${r.toFixed(1).padStart(4, '0')}` : `${r.toFixed(1)} s`;
  }

  function measure() { W = arena.clientWidth; H = arena.clientHeight; sizeFx(); }
  addEventListener('resize', () => { measure(); layout(); });

  /* ---------- sonido (sintetizado, sin archivos) ---------- */
  function tone(freq, dur = .07, type = 'triangle', vol = .12, to = null) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  const blip = (f, d) => tone(f, d);
  function quack() {                                             // "cuac" del Tío Pato: más grave y ronco si está enojado
    const a = anger();
    tone(420 - a * 120, .13, 'sawtooth', .09, 230 - a * 80);
    setTimeout(() => tone(340 - a * 110, .09, 'square', .05, 200 - a * 70), 70);
  }

  /* ---------- efectos: estela del billete y partículas ---------- */
  const fx = $('fx'), cx = fx.getContext('2d');
  let dpr = 1; const trail = [], parts = [];
  function sizeFx() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    fx.width = Math.round(W * dpr); fx.height = Math.round(H * dpr);
    fx.style.width = W + 'px'; fx.style.height = H + 'px';
  }
  function burst(bx, by, n, colors, speed, up = false) {
    for (let i = 0; i < n; i++) {
      const a = up ? -Math.PI * (.15 + Math.random() * .7) : Math.random() * Math.PI * 2, v = speed * (.4 + Math.random() * .8);
      parts.push({ x: bx, y: by, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, r: 2 + Math.random() * 3, c: colors[i % colors.length] });
    }
  }
  function drawFx(dt) {
    cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, W, H);
    for (let i = 0; i < trail.length; i++) {                     // estela
      const t = trail[i], k = (i + 1) / trail.length;
      cx.globalAlpha = .26 * k; cx.fillStyle = '#ffc928';
      cx.beginPath(); cx.arc(t[0], t[1], R * (.35 + .55 * k), 0, 6.283); cx.fill();
    }
    for (let i = parts.length - 1; i >= 0; i--) {                // partículas
      const p = parts[i]; p.life -= dt * 2.2;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt;
      cx.globalAlpha = Math.max(0, p.life); cx.fillStyle = p.c;
      cx.beginPath(); cx.arc(p.x, p.y, p.r * p.life + .5, 0, 6.283); cx.fill();
    }
    cx.globalAlpha = 1;
  }
  function clearFx() { trail.length = 0; parts.length = 0; cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, fx.width, fx.height); }

  /* ---------- marcadores: servidor (Firebase Realtime Database por REST) ---------- */
  async function http(url, opts) {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 8000);
    try { return await fetch(url, { ...opts, signal: ctl.signal }); }
    finally { clearTimeout(to); }
  }

  // Sube el mejor tiempo si hay algo pendiente. Devuelve 'ok' | 'local' | 'error'.
  async function syncBest() {
    if (!player.dirty || player.best <= 0) return 'ok';
    if (!ONLINE) { player.dirty = false; savePlayer(); return 'local'; }
    try {
      const r = await http(`${DB}/scores/${player.id}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ n: player.name, s: player.best, t: { '.sv': 'timestamp' } })
      });
      // 401/403: el servidor ya tiene un tiempo igual o mayor; no hay nada que reintentar.
      if (r.ok || r.status === 401 || r.status === 403) { player.dirty = false; savePlayer(); return 'ok'; }
      return 'error';
    } catch (e) { return 'error'; }
  }

  // Lista de los mejores, ya ordenada de mayor a menor.
  async function fetchTop() {
    if (!ONLINE) {
      return player.best > 0 ? [{ id: player.id, n: player.name || 'Tú', s: player.best, t: 0 }] : [];
    }
    const r = await http(`${DB}/scores.json?orderBy=%22s%22&limitToLast=${TOP_N}`);
    if (!r.ok) throw new Error('http ' + r.status);
    const data = (await r.json()) || {};
    return Object.entries(data)
      .filter(([, v]) => v && typeof v.s === 'number' && typeof v.n === 'string')
      .map(([id, v]) => ({ id, n: v.n, s: v.s, t: +v.t || 0 }))
      .sort((a, b) => b.s - a.s || a.t - b.t);
  }
  async function fetchLeader() {                                 // el mejor tiempo del marcador (para el encabezado)
    let top = player.best;
    if (ONLINE) {
      try {
        const r = await http(`${DB}/scores.json?orderBy=%22s%22&limitToLast=1`);
        if (r.ok) top = Math.max(top, ...Object.values((await r.json()) || {}).map(v => (v && +v.s) || 0));
      } catch (e) {}
    }
    leaderDs = top; renderScores();
  }

  /* ---------- pantalla de marcadores ---------- */
  let boardFrom = 'menu', boardTimer = null;

  function renderBoard(rows) {
    const ul = $('list'); ul.textContent = '';
    if (!rows.length) {
      const li = document.createElement('li'); li.className = 'empty';
      li.textContent = 'Todavía nadie aguanta al Tío Pato. ¡Sé el primero!';
      ul.appendChild(li); return;
    }
    const medals = ['🥇', '🥈', '🥉'];
    const frag = document.createDocumentFragment();
    rows.forEach((row, i) => {
      const li = document.createElement('li');
      if (i < 3) li.classList.add('top');
      if (row.id === player.id) li.classList.add('mine');
      const rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = medals[i] || (i + 1);
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = row.n;   // textContent: nunca HTML
      const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = fmtTime(row.s);
      li.append(rk, nm, sc); frag.appendChild(li);
    });
    ul.appendChild(frag);
    const mine = ul.querySelector('.mine');
    if (mine && !ul.dataset.scrolled) { mine.scrollIntoView({ block: 'center' }); ul.dataset.scrolled = '1'; }
  }

  async function refreshBoard() {
    const note = $('boardNote');
    note.textContent = ONLINE ? 'Actualizando…' : 'Modo local: aquí solo aparece tu mejor tiempo en este dispositivo.';
    try {
      if (player.dirty) await syncBest();
      const rows = await fetchTop();
      renderBoard(rows);
      if (ONLINE) {
        const pos = rows.findIndex(r => r.id === player.id);
        note.textContent = pos >= 0
          ? `Vas en el puesto ${pos + 1} · gana quien aguante más tiempo`
          : (player.best > 0 ? `Tu mejor: ${fmtTime(player.best)} · aún fuera del Top ${TOP_N}` : `Top ${TOP_N} · gana quien aguante más tiempo`);
      }
    } catch (e) {
      note.textContent = 'No se pudo cargar. Reintentando…';
    }
  }

  function openBoard(from) {
    boardFrom = from; delete $('list').dataset.scrolled;
    setEnd(false); document.body.style.backgroundColor = PALETTE[0];
    show('board'); refreshBoard();
    clearInterval(boardTimer); boardTimer = setInterval(refreshBoard, REFRESH_MS);
  }
  function closeBoard() {
    clearInterval(boardTimer); boardTimer = null;
    if (boardFrom === 'result') { setEnd(true); show('result'); } else show('menu');
  }

  /* ---------- encabezado: tu tiempo · el mejor tiempo ---------- */
  // La corona es del Tío Pato mientras no superes el mejor tiempo.
  function renderScores() {
    const d = state === 'play' || state === 'over' ? ds() : 0;
    meNum.textContent = pad(Math.floor(d / 10));
    botNum.textContent = pad(Math.floor(leaderDs / 10));
    const beating = d > leaderDs && d > 0;
    meAv.classList.toggle('lead', beating);
    botAv.classList.toggle('lead', !beating);
  }
  function setBg() { document.body.style.backgroundColor = PALETTE[Math.min(Math.floor(elapsed / 10), PALETTE.length - 1)]; }
  function setEnd(on) { document.body.classList.toggle('end', on); }
  function bump(el) { el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 140); }
  function setInitial() { $('meInit').textContent = player.name ? [...player.name][0].toUpperCase() : '😎'; }

  /* ---------- el Tío Pato: devuelve SIEMPRE el billete y se va enojando ---------- */
  function setFace() {                                           // emoji, o la imagen que corresponde al enojo
    const stage = PATO_IMGS.length ? Math.min(PATO_IMGS.length - 1, Math.floor(anger() * PATO_IMGS.length)) : -1;
    if (stage === faceStage) return;
    faceStage = stage;
    duck.classList.toggle('imgs', stage >= 0); botAv.classList.toggle('pic', stage >= 0);
    for (const id of ['duckFace', 'botFace']) {
      const el = $(id); el.textContent = '';
      if (stage < 0) el.textContent = '🦆';
      else { const im = document.createElement('img'); im.src = PATO_IMGS[stage]; im.alt = ''; im.draggable = false; el.appendChild(im); }
    }
  }
  function setHeroes() {                                         // la cara grande de las pantallas de inicio y final
    for (const [id, i] of [['heroBox', 0], ['heroEnd', PATO_IMGS.length - 1]]) {
      const el = $(id); el.textContent = '';
      if (!PATO_IMGS.length) { el.innerHTML = '<span style="font-size:84px">🦆</span>'; continue; }
      const im = document.createElement('img'); im.src = PATO_IMGS[i]; im.alt = ''; im.draggable = false; el.appendChild(im);
    }
  }
  function duckLook() {
    const a = anger();
    duck.style.setProperty('--anger', a.toFixed(2));
    duck.style.setProperty('--shake', (a * 3.5).toFixed(1) + 'px');
    duck.classList.toggle('mad', a > .25);
    setFace();
  }
  function say(text, ms = 2300) {
    const b = $('bubble'); b.textContent = text; b.classList.add('on');
    clearTimeout(bubbleTimer); bubbleTimer = setTimeout(() => b.classList.remove('on'), ms);
  }
  const TAUNTS = ['Mmm… no está mal', '¡Cuac! ¿Ya te cansaste?', '¡Ahora sí me enojé!', '¡Tu barra se achica, cuac!', '¡RÍNDETE!', '¡CUAC CUAC CUAC!'];

  // Dónde llegará el billete a la altura del Tío Pato (con rebotes en las paredes), para que salga a recibirlo.
  function predictX() {
    const t = Math.max(0, (y - DUCK_BOTTOM - R) / Math.max(1, -vy));
    const span = W - 2 * R;
    const u = ((x - R + vx * t) % (2 * span) + 2 * span) % (2 * span);
    return R + (u > span ? 2 * span - u : u);
  }
  function duckTrack(dt) {
    const want = vy < 0 ? predictX() : W / 2 + (x - W / 2) * .5;
    const maxMove = (520 + level() * 140) * dt;
    duckX = clamp(duckX + clamp(want - duckX, -maxMove, maxMove), 34, W - 34);
    duckShow += (duckX - duckShow) * Math.min(1, dt * 28);
  }
  // El Tío Pato le pega al billete SIEMPRE: nada pasa por arriba de él. Apunta al lado contrario de tu barra,
  // con más precisión cuanto más nivel tenga.
  function duckReturn() {
    y = DUCK_BOTTOM + R; duckX = clamp(x, 34, W - 34);
    const lv = Math.min(level(), 4);
    let tx = lv === 0 ? x + (Math.random() - .5) * W * .6 : (W - px) + (Math.random() - .5) * W * (.4 - lv * .07);
    tx = clamp(tx, R, W - R);
    setVel(tx - x, paddleTop() - y);
    const f = $('duckFace'); f.classList.remove('swing'); void f.offsetWidth; f.classList.add('swing');
    quack();
    burst(x, y - R, 6 + Math.round(anger() * 8), anger() > .5 ? ['#ff3b1f', '#ff9a2e', '#fff'] : ['#fff', '#ffd54a'], 220 + anger() * 160);
    if (anger() > .45) { arena.classList.remove('jolt'); void arena.offsetWidth; arena.classList.add('jolt'); }
  }
  function levelUp() {
    bump(botNum); tone(990, .22);
    say(TAUNTS[Math.min(level() - 1, TAUNTS.length - 1)]);
  }

  /* ---------- física ---------- */
  // Dirección (dx, dy) con la rapidez actual. Siempre en diagonal: nunca casi vertical (subiría y bajaría
  // en línea recta) ni casi horizontal (se quedaría rebotando de lado a lado).
  const sgn = v => (v < 0 ? -1 : v > 0 ? 1 : (Math.random() < .5 ? -1 : 1));
  function setVel(dx, dy) {
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const minX = .42, minY = .34;
    if (Math.abs(dx) < minX) { dy = sgn(dy) * Math.sqrt(1 - minX * minX); dx = sgn(dx) * minX; }
    if (Math.abs(dy) < minY) { dx = sgn(dx) * Math.sqrt(1 - minY * minY); dy = sgn(dy) * minY; }
    const sp = ballSpeed();
    vx = dx * sp; vy = dy * sp;
  }
  function launch() {                  // el Tío Pato lanza el billete en diagonal desde donde está
    x = clamp(duckX, R, W - R); y = DUCK_BOTTOM + R + 4;
    const a = (.25 + Math.random() * .5) * (Math.random() < .5 ? -1 : 1);
    setVel(Math.sin(a), Math.cos(a));
  }
  function layout() {
    basePw = clamp(W * .3, 92, 140); pw = basePw * shrink();
    paddle.style.width = pw + 'px';
    paddle.style.top = paddleTop() + 'px';
    px = clamp(px || W / 2, pw / 2, W - pw / 2);
  }
  function draw() {
    target.style.transform = `translate(${x - SIZE / 2}px, ${y - SIZE / 2}px)`;
    paddle.style.transform = `translateX(${px - pw / 2}px)`;
    duck.style.transform = `translateX(${duckShow - duck.offsetWidth / 2}px) scale(${1 + anger() * .22})`;
  }

  function wallBounce() { setVel(vx + (Math.random() - .5) * ballSpeed() * .08, vy); tone(260, .04); }

  // Un paso corto de física (el billete nunca avanza más de ~10 px, así no atraviesa nada).
  function step(h) {
    const prevY = y;
    x += vx * h; y += vy * h;
    if (x < R) { x = R; vx = Math.abs(vx); wallBounce(); }
    else if (x > W - R) { x = W - R; vx = -Math.abs(vx); wallBounce(); }

    if (vy < 0 && y - R <= DUCK_BOTTOM) duckReturn();           // el Tío Pato nunca falla

    const top = paddleTop();
    if (vy > 0 && prevY + R <= top + 2 && y + R >= top && Math.abs(x - px) <= pw / 2 + R * .7) {
      y = top - R;
      hits++;                                                    // ¡un rebote más!
      const off = clamp((x - px) / (pw / 2 + R * .7) + (Math.random() - .5) * .3, -1, 1);
      setVel(Math.sin(off * 1.05), -Math.cos(off * 1.05));       // el ángulo depende de dónde pega en la barra
      if (hits % LEVEL_EVERY === 0) levelUp();
      duckLook();
      spawn('pop', x, top - 28, '+' + hits);
      burst(x, top, 8, ['#ffd54a', '#fff', '#ffb300'], 260, true);
      paddle.classList.add('hit'); setTimeout(() => paddle.classList.remove('hit'), 90);
      tone(480 + Math.min(hits, 40) * 14, .07);
      if (navigator.vibrate) navigator.vibrate(8);
    }
    if (y - R > H) endGame();                                    // se cayó por abajo: fin
  }

  function spawn(cls, sx, sy, text) {
    const el = document.createElement('div');
    el.className = cls; el.style.left = sx + 'px'; el.style.top = sy + 'px';
    if (text) el.textContent = text;
    arena.appendChild(el);
    setTimeout(() => el.remove(), 650);
  }

  /* ---------- control: arrastrar (en el celular, relativo: el dedo no tapa la barra) · mouse · flechas ---------- */
  function movePaddle(e) {
    if (state !== 'play' && state !== 'countdown') return;
    const r = arena.getBoundingClientRect();
    if (e.pointerType === 'mouse') px = e.clientX - r.left;
    else if (dragX !== null) px += (e.clientX - dragX) * 1.25;
    dragX = e.clientX;
    px = clamp(px, pw / 2, W - pw / 2);
    if (state === 'countdown') draw();
  }
  arena.addEventListener('pointerdown', e => {
    if (state !== 'play' && state !== 'countdown') return;       // en los menús los botones reciben el toque con normalidad
    dragX = e.clientX; try { arena.setPointerCapture(e.pointerId); } catch (_) {}
    movePaddle(e);
  });
  arena.addEventListener('pointermove', movePaddle);
  const endDrag = () => { dragX = null; };
  arena.addEventListener('pointerup', endDrag); arena.addEventListener('pointercancel', endDrag);
  addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keyDir = -1;
    else if (e.key === 'ArrowRight' || e.key === 'd') keyDir = 1;
  });
  addEventListener('keyup', e => {
    if ((e.key === 'ArrowLeft' || e.key === 'a') && keyDir < 0) keyDir = 0;
    if ((e.key === 'ArrowRight' || e.key === 'd') && keyDir > 0) keyDir = 0;
  });

  /* ---------- flujo de juego ---------- */
  function show(name) {
    for (const k in screens) screens[k].classList.toggle('show', k === name);
  }
  function setBig(t) {
    big.textContent = t;
    big.classList.remove('tick'); void big.offsetWidth; big.classList.add('tick');
  }

  function startCountdown() {
    const name = cleanName(nameInput.value);
    if (!name) {
      nameInput.classList.remove('shake'); void nameInput.offsetWidth; nameInput.classList.add('shake');
      nameInput.focus(); return;
    }
    if (name !== player.name) { player.name = name; if (player.best > 0) player.dirty = true; savePlayer(); }
    nameInput.value = name; nameInput.blur(); setInitial();

    measure();
    hits = 0; elapsed = 0; keyDir = 0; dragX = null; lastSec = -1; faceStage = -2;
    clearFx(); $('rain').textContent = ''; setEnd(false); setBg();
    layout(); duckX = duckShow = W / 2; px = W / 2;
    state = 'countdown'; renderScores(); show(null);
    target.style.visibility = 'hidden';
    paddle.style.visibility = 'visible'; duck.style.visibility = 'visible';
    duckLook(); draw(); say('¡Gánale al Tío Pato!', 2600);
    let n = 3; setBig(n); blip(440, .1);
    clearInterval(cdTimer);
    cdTimer = setInterval(() => {
      n--;
      if (n > 0) { setBig(n); blip(440, .1); }
      else { clearInterval(cdTimer); cdTimer = null; beginPlay(); }
    }, 1000);
  }

  function beginPlay() {
    state = 'play';
    launch(); draw();
    target.style.visibility = 'visible';
    setBig(0); lastSec = 0;
    last = performance.now();
    tone(880, .2);
    requestAnimationFrame(loop);
  }

  function loop(now) {
    if (state !== 'play') return;
    const dt = Math.min((now - last) / 1000, .034); last = now;   // si la pestaña se oculta, el tiempo se pausa solo
    elapsed += dt;
    const sec = Math.floor(elapsed);
    if (sec !== lastSec) { lastSec = sec; setBig(sec); setBg(); }
    if (keyDir) px = clamp(px + keyDir * 760 * dt, pw / 2, W - pw / 2);
    const wantPw = basePw * shrink();                              // la barra se achica suavemente
    if (Math.abs(pw - wantPw) > .3) { pw += (wantPw - pw) * Math.min(1, dt * 5); paddle.style.width = pw + 'px'; px = clamp(px, pw / 2, W - pw / 2); }
    duckTrack(dt);
    const n = Math.max(1, Math.ceil(Math.hypot(vx, vy) * dt / 10));
    for (let i = 0; i < n && state === 'play'; i++) step(dt / n);
    trail.push([x, y]); if (trail.length > 9) trail.shift();
    drawFx(dt);
    draw(); renderScores();
    if (state === 'play') requestAnimationFrame(loop);
  }

  function makeRain() {
    const rain = $('rain'); rain.textContent = '';
    for (let i = 0; i < 38; i++) {
      const sp = document.createElement('span');
      sp.textContent = '💸';
      sp.style.left = (Math.random() * 96) + '%';
      sp.style.fontSize = (22 + Math.random() * 28) + 'px';
      sp.style.animationDuration = (3.5 + Math.random() * 3.5) + 's';
      sp.style.animationDelay = (-Math.random() * 6) + 's';
      rain.appendChild(sp);
    }
  }

  async function endGame() {
    state = 'over';
    target.style.visibility = 'hidden'; paddle.style.visibility = 'hidden'; duck.style.visibility = 'hidden';
    $('bubble').classList.remove('on'); big.textContent = ''; clearFx();

    const score = ds();
    const record = score > player.best;
    if (record) { player.best = score; player.dirty = true; savePlayer(); }
    $('finalScore').textContent = fmtTime(score);
    $('finalSub').textContent = `${hits} ${hits === 1 ? 'rebote' : 'rebotes'} · nivel ${level() + 1} del Tío Pato`;
    $('bestResult').textContent = record ? '🎉 ¡Nuevo récord personal!' : `Tu mejor tiempo: ${fmtTime(player.best)}`;
    renderScores(); makeRain(); setEnd(true);
    tone(300, .35, 'sawtooth', .1, 120);
    show('result');

    const st = $('saveStatus');
    st.className = 'status';
    if (!player.dirty) { st.textContent = ''; fetchLeader(); return; }
    st.textContent = 'Guardando tu tiempo…';
    const res = await syncBest();
    if (state !== 'over') return;                                  // ya empezó otra partida
    if (res === 'error') { st.className = 'status err'; st.textContent = 'No se pudo guardar. Se reintentará solo.'; return; }
    st.textContent = res === 'local' ? 'Tiempo guardado en este dispositivo.' : '✅ Tiempo guardado en los marcadores';
    fetchLeader();
    if (res === 'ok' && ONLINE) {
      try {
        const pos = (await fetchTop()).findIndex(r => r.id === player.id);
        if (state === 'over' && pos >= 0) st.textContent = `✅ Guardado · vas en el puesto ${pos + 1} del marcador`;
      } catch (e) {}
    }
  }

  function backToMenu() {
    clearInterval(cdTimer); cdTimer = null;
    clearInterval(boardTimer); boardTimer = null;
    state = 'menu';
    target.style.visibility = 'hidden'; paddle.style.visibility = 'hidden'; duck.style.visibility = 'hidden';
    $('bubble').classList.remove('on'); big.textContent = ''; clearFx();
    setEnd(false); document.body.style.backgroundColor = '';
    hits = 0; elapsed = 0; renderScores(); fetchLeader();
    $('bestMenu').textContent = player.best ? `Tu mejor tiempo: ${fmtTime(player.best)}` : '';
    show('menu');
  }

  $('play').addEventListener('click', startCountdown);
  $('again').addEventListener('click', startCountdown);
  $('close').addEventListener('click', backToMenu);
  $('backResult').addEventListener('click', backToMenu);
  $('openBoard').addEventListener('click', () => openBoard('menu'));
  $('openBoard2').addEventListener('click', () => openBoard('result'));
  $('backBoard').addEventListener('click', closeBoard);
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') startCountdown(); });

  nameInput.value = player.name;
  measure(); layout(); setInitial(); duckLook(); setHeroes();
  leaderDs = player.best; renderScores();
  target.style.visibility = 'hidden';
  $('bestMenu').textContent = player.best ? `Tu mejor tiempo: ${fmtTime(player.best)}` : '';
  if (player.dirty) syncBest().then(fetchLeader); else fetchLeader();   // reintenta un tiempo pendiente
})();
</script>
</body>
</html>
